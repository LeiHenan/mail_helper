<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>写邮件</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {},
            "borderRadius": {
                    "DEFAULT": "0.5rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {
                'safe': 'env(safe-area-inset-bottom)'
            },
            "fontFamily": {
                    "headline": [
                            "Public Sans", "sans-serif"
                    ],
                    "display": [
                            "Public Sans", "sans-serif"
                    ],
                    "body": [
                            "Public Sans", "sans-serif"
                    ],
                    "label": [
                            "Public Sans", "sans-serif"
                    ]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-body antialiased min-h-screen flex flex-col pt-14 pb-12">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-4 h-14 z-50">
<button class="text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 active:opacity-70 transition-opacity h-11 min-w-[44px] flex items-center justify-center font-headline text-lg font-medium">
            取消
        </button>
<h1 class="font-headline text-lg font-bold text-slate-900 dark:text-white">写邮件</h1>
<button class="text-indigo-600 dark:text-indigo-400 hover:bg-slate-50 dark:hover:bg-slate-800 active:opacity-70 transition-opacity h-11 min-w-[44px] flex items-center justify-center font-headline text-lg font-medium">
            发送
        </button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto w-full max-w-3xl mx-auto flex flex-col">
<!-- From Field -->
<div class="px-4 py-3 flex items-center border-b border-slate-100 dark:border-slate-800/50 min-h-[44px]">
<span class="text-slate-500 text-sm font-medium w-16 flex-shrink-0">发件人</span>
<button class="flex-1 flex items-center justify-between text-left h-full active:opacity-70 transition-opacity ml-2">
<span class="text-slate-900 dark:text-slate-100 text-[15px]">service@harmony.com</span>
<span class="material-symbols-outlined text-slate-400 text-xl">keyboard_arrow_down</span>
</button>
</div>
<!-- To Field -->
<div class="px-4 py-3 flex flex-col border-b border-slate-100 dark:border-slate-800/50 min-h-[44px]">
<div class="flex items-center">
<span class="text-slate-500 text-sm font-medium w-16 flex-shrink-0">收件人</span>
<div class="flex-1 flex flex-wrap items-center gap-2 ml-2 min-h-[24px]">
<!-- Sample Contact Chip -->
<div class="flex items-center bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-full px-2 py-1 h-7">
<img alt="Avatar" class="w-5 h-5 rounded-full object-cover mr-1.5" data-alt="A small, circular avatar image for an email contact chip. The image shows a friendly, stylized vector illustration of a person's face against a soft indigo background, suitable for a modern email app interface. High quality, flat design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFNe3uCpWTQ7tgOxBVmvhoziBA7KwsZWG8mrAqOmir8yx6rMh343eWp1I7emAiSj_6RiaLzn6w8HVRu8m4CZTkzuE_glsK2wCUuHQZrfVmhNHG6Fz8ClAgEQmwDSOiv_5epg-zhXD09rQMy2leM9PM44HeIiDF2Pt4H7i49L1IJ0084Nmc4lz9eVZvyFiyFL5e3d-tE3heXZWXC9X0vSUktUWb35gPqOq35EODrkDwNdPWD_JTeNYkJAJbD2Bs2Lyij2Kd1P2OHupS"/>
<span class="text-sm">Alex Chen</span>
</div>
<!-- Input placeholder -->
<input class="flex-1 bg-transparent border-none focus:ring-0 text-[15px] p-0 min-w-[100px] text-slate-900 dark:text-slate-100 placeholder-slate-400" placeholder="" type="text"/>
</div>
<div class="flex items-center gap-1 ml-2">
<button class="text-indigo-600 dark:text-indigo-400 text-sm font-medium px-2 py-1 rounded hover:bg-slate-50 dark:hover:bg-slate-800">
                        抄送/密送
                    </button>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors">
<span class="material-symbols-outlined text-[22px]">add</span>
</button>
</div>
</div>
</div>
<!-- Subject Field -->
<div class="px-4 py-3 flex items-center border-b border-slate-100 dark:border-slate-800/50 min-h-[44px]">
<span class="text-slate-500 text-sm font-medium w-16 flex-shrink-0">主题</span>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-[15px] p-0 ml-2 text-slate-900 dark:text-slate-100 font-medium placeholder-slate-400" placeholder="" type="text"/>
</div>
<!-- Body Area -->
<div class="flex-1 px-4 py-4 flex flex-col relative">
<textarea class="flex-1 w-full bg-transparent border-none focus:ring-0 resize-none text-[15px] text-slate-800 dark:text-slate-200 p-0 leading-relaxed min-h-[200px]" placeholder=""></textarea>
<div class="mt-4 text-slate-400 text-sm select-none">
<br/><br/>
                --- 来自 Harmony 邮件助手
            </div>
</div>
</main>
<!-- BottomNavBar (Toolbar above keyboard area) -->
<nav class="fixed bottom-0 left-0 w-full h-12 z-50 flex justify-around items-center px-6 pb-safe bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800">
<button class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 active:scale-90 transition-transform duration-200 w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined">attach_file</span>
</button>
<button class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 active:scale-90 transition-transform duration-200 w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined">image</span>
</button>
<button class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 active:scale-90 transition-transform duration-200 w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined">format_size</span>
</button>
<button class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 active:scale-90 transition-transform duration-200 w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined">schedule</span>
</button>
<button class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 active:scale-90 transition-transform duration-200 w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</nav>
</body></html>
