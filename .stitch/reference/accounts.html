<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>账户管理 - HarmonyOS NEXT</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {},
            "borderRadius": {
                    "DEFAULT": "0.5rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": [
                            "Public Sans", "sans-serif"
                    ],
                    "display": [
                            "Public Sans", "sans-serif"
                    ],
                    "body": [
                            "Public Sans", "sans-serif"
                    ],
                    "label": [
                            "Public Sans", "sans-serif"
                    ]
            },
            "fontSize": {}
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Public Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAFA; /* Cold white background */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4F46E5; /* indigo-600 */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4F46E5; /* indigo-600 */
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e2e8f0;
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #cbd5e1;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .toggle-dot {
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            transition: all 0.3s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(1.5rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-slate-900 bg-slate-50 antialiased min-h-screen flex flex-col justify-center items-center">
<!-- Mobile Device Container for Preview (390px width) -->
<div class="w-full max-w-[390px] h-screen max-h-[844px] bg-slate-50 relative flex flex-col overflow-hidden shadow-2xl mx-auto sm:rounded-[2.5rem] sm:border-[8px] border-slate-800">
<!-- Status Bar Simulator (Optional, for realistic look) -->
<div class="h-12 w-full flex justify-between items-center px-6 text-slate-800 z-50 bg-slate-50">
<span class="text-sm font-semibold font-body">09:41</span>
<div class="flex space-x-2 items-center">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- TopAppBar (from JSON) -->
<header class="fixed top-0 w-full z-50 flex items-center px-4 h-14 bg-slate-50 border-b border-slate-100 max-w-[390px]" style="margin-top: 48px;">
<button class="p-2 rounded-full hover:bg-slate-100 transition-colors active:scale-95 duration-150 flex items-center justify-center text-indigo-600">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-headline text-lg font-semibold tracking-tight text-indigo-600">账户管理</h1>
<button class="p-2 rounded-full hover:bg-slate-100 transition-colors active:scale-95 duration-150 flex items-center justify-center text-indigo-600">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-4 pt-[116px] pb-[100px] space-y-3 relative z-10">
<!-- Section Title (Optional context) -->
<h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 ml-2">已连接的邮箱</h2>
<!-- Account Card 1: QQ Mail -->
<div class="bg-white rounded-[18px] p-4 border border-slate-200/60 shadow-sm flex items-center space-x-4 active:scale-[0.98] transition-transform duration-200">
<div class="relative flex-shrink-0">
<div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold text-lg font-display">
                        Q
                    </div>
<!-- Online Status Dot -->
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-cyan-400 border-2 border-white rounded-full"></div>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-base font-semibold text-slate-900 truncate font-body">123456789@qq.com</h3>
<div class="flex items-center text-xs text-slate-500 mt-0.5 space-x-2 font-label">
<span class="font-medium text-indigo-500">Unread: 12</span>
<span class="w-1 h-1 rounded-full bg-slate-300"></span>
<span class="truncate">Last synced: 2 mins ago</span>
</div>
</div>
<div class="flex items-center space-x-2 flex-shrink-0">
<!-- Toggle Switch -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0" id="toggle1" name="toggle1" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="toggle1">
<span class="toggle-dot absolute block bg-white w-5 h-5 rounded-full shadow inset-y-0 left-0"></span>
</label>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- Account Card 2: 163 Mail -->
<div class="bg-white rounded-[18px] p-4 border border-slate-200/60 shadow-sm flex items-center space-x-4 active:scale-[0.98] transition-transform duration-200">
<div class="relative flex-shrink-0">
<div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold text-sm font-display">
                        163
                    </div>
<!-- Online Status Dot -->
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-cyan-400 border-2 border-white rounded-full"></div>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-base font-semibold text-slate-900 truncate font-body">work_account@163.com</h3>
<div class="flex items-center text-xs text-slate-500 mt-0.5 space-x-2 font-label">
<span class="font-medium text-slate-500">Unread: 0</span>
<span class="w-1 h-1 rounded-full bg-slate-300"></span>
<span class="truncate">Last synced: 10 mins ago</span>
</div>
</div>
<div class="flex items-center space-x-2 flex-shrink-0">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0" id="toggle2" name="toggle2" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="toggle2">
<span class="toggle-dot absolute block bg-white w-5 h-5 rounded-full shadow inset-y-0 left-0"></span>
</label>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- Account Card 3: Gmail -->
<div class="bg-white rounded-[18px] p-4 border border-slate-200/60 shadow-sm flex items-center space-x-4 active:scale-[0.98] transition-transform duration-200 opacity-75">
<div class="relative flex-shrink-0">
<div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 font-bold text-lg font-display">
                        G
                    </div>
<!-- Offline Status Dot -->
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-slate-300 border-2 border-white rounded-full"></div>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-base font-medium text-slate-600 truncate font-body">personal.use@gmail.com</h3>
<div class="flex items-center text-xs text-slate-400 mt-0.5 space-x-2 font-label">
<span class="truncate">Sync paused</span>
</div>
</div>
<div class="flex items-center space-x-2 flex-shrink-0">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0" id="toggle3" name="toggle3" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-200 cursor-pointer" for="toggle3">
<span class="toggle-dot absolute block bg-white w-5 h-5 rounded-full shadow inset-y-0 left-0"></span>
</label>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- Account Card 4: Outlook -->
<div class="bg-white rounded-[18px] p-4 border border-slate-200/60 shadow-sm flex items-center space-x-4 active:scale-[0.98] transition-transform duration-200">
<div class="relative flex-shrink-0">
<div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 font-bold text-lg font-display">
                        O
                    </div>
<!-- Online Status Dot -->
<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-cyan-400 border-2 border-white rounded-full"></div>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-base font-semibold text-slate-900 truncate font-body">business@outlook.com</h3>
<div class="flex items-center text-xs text-slate-500 mt-0.5 space-x-2 font-label">
<span class="font-medium text-indigo-500">Unread: 45</span>
<span class="w-1 h-1 rounded-full bg-slate-300"></span>
<span class="truncate">Last synced: 1 hour ago</span>
</div>
</div>
<div class="flex items-center space-x-2 flex-shrink-0">
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0" id="toggle4" name="toggle4" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="toggle4">
<span class="toggle-dot absolute block bg-white w-5 h-5 rounded-full shadow inset-y-0 left-0"></span>
</label>
</div>
<button class="p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined text-xl">more_vert</span>
</button>
</div>
</div>
<!-- Spacer to ensure content can scroll past the FAB -->
<div class="h-16"></div>
</main>
<!-- Floating Action Area (Fixed Bottom) -->
<div class="absolute bottom-0 w-full px-6 pb-8 pt-4 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent z-40 max-w-[390px]">
<button class="w-full h-14 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 font-semibold text-[17px] active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span>添加邮箱账户</span>
</button>
</div>
</div>
</body></html>
