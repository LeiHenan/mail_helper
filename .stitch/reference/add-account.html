<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>添加账户</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {},
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 text-slate-900 h-screen w-full flex justify-center overflow-hidden">
<!-- Mobile Frame for preview purposes (simulating 390px width) -->
<div class="w-full max-w-[390px] h-full relative bg-slate-50 flex flex-col shadow-2xl overflow-hidden sm:border-x sm:border-slate-200">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-[390px] z-50 flex items-center px-4 h-14 bg-slate-50 border-b border-slate-100 docked full-width">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 transition-colors active:scale-95 duration-150 text-indigo-600">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<div class="flex-1 text-center pr-10">
<h1 class="font-headline text-lg font-semibold tracking-tight text-slate-900">添加账户</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pt-16 pb-24 px-4 custom-scrollbar">
<div class="mb-6 mt-4">
<h2 class="text-sm font-semibold text-slate-500 mb-4 px-1">选择服务商</h2>
<!-- Account Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- QQ -->
<button class="flex flex-col items-center justify-center bg-white border border-slate-100 rounded-[20px] p-6 shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3 text-slate-400">
<span class="material-symbols-outlined text-3xl">mail</span>
</div>
<span class="font-medium text-slate-800 text-sm">QQ邮箱</span>
</button>
<!-- 163 -->
<button class="flex flex-col items-center justify-center bg-white border border-slate-100 rounded-[20px] p-6 shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3 text-slate-400">
<span class="material-symbols-outlined text-3xl">mail</span>
</div>
<span class="font-medium text-slate-800 text-sm">163邮箱</span>
</button>
<!-- Gmail -->
<button class="flex flex-col items-center justify-center bg-white border border-slate-100 rounded-[20px] p-6 shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3 text-slate-400">
<span class="material-symbols-outlined text-3xl">mail</span>
</div>
<span class="font-medium text-slate-800 text-sm">Gmail</span>
</button>
<!-- Outlook -->
<button class="flex flex-col items-center justify-center bg-white border border-slate-100 rounded-[20px] p-6 shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3 text-slate-400">
<span class="material-symbols-outlined text-3xl">mail</span>
</div>
<span class="font-medium text-slate-800 text-sm">Outlook</span>
</button>
</div>
</div>
<!-- Other Mail Option -->
<div class="mt-2">
<button class="w-full flex items-center justify-between bg-white border border-slate-100 rounded-[20px] p-4 shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600">
<span class="material-symbols-outlined">settings</span>
</div>
<div class="text-left">
<p class="font-medium text-slate-800 text-sm">其他邮箱</p>
<p class="text-xs text-slate-500 mt-0.5">IMAP/SMTP/Exchange</p>
</div>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
</main>
<!-- Footer -->
<footer class="absolute bottom-0 w-full p-6 text-center bg-gradient-to-t from-slate-50 via-slate-50 to-transparent">
<p class="text-xs text-slate-400 leading-relaxed max-w-[280px] mx-auto">
                登录即表示同意 <a class="text-indigo-500 hover:underline" href="#">隐私与授权说明</a> 以及 <a class="text-indigo-500 hover:underline" href="#">服务条款</a>。我们将加密保护您的数据安全。
            </p>
</footer>
</div>
</body></html>
